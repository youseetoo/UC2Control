name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Which variant to build'
        required: true
        default: 'both'
        type: choice
        options: [ debug, release, both ]

permissions:
  contents: write

jobs:
  build:
    name: Assemble
    runs-on: ubuntu-latest

    # Secrets are lifted to job level on purpose: the `secrets` context is not
    # available in a step-level `if:`, but `env` is. Signing is optional — with
    # no secrets set these are empty and the release APK is built unsigned.
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Derive version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            NAME="${GITHUB_REF#refs/tags/v}"
          else
            NAME="0.0.0-${GITHUB_REF_NAME//\//-}+${GITHUB_SHA::7}"
          fi
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "Building version ${NAME} (code ${GITHUB_RUN_NUMBER})"

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Decode and verify signing keystore
        # Runs only when KEYSTORE_BASE64 is set. Writes to RUNNER_TEMP rather
        # than the checkout so the key can never be picked up by an artifact
        # upload, and exports KEYSTORE_FILE for the release build below.
        #
        # The three checks below exist because AGP's own failures for a wrong
        # alias or password are a KeytoolException buried in a Gradle stack
        # trace, with every useful value masked as ***. Failing here instead
        # says which of the four secrets is wrong, in one line.
        if: env.KEYSTORE_BASE64 != ''
        run: |
          set -euo pipefail
          KS="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$KS"

          # 1. Is it a keystore at all?
          if ! [ -s "$KS" ]; then
            echo "::error::KEYSTORE_BASE64 decoded to an empty file. Re-run:"
            echo "::error::  base64 -i /path/to/your.keystore | gh secret set KEYSTORE_BASE64"
            exit 1
          fi
          echo "Keystore decoded ($(stat -c%s "$KS") bytes)"

          # 2. Does the store password open it?
          if ! keytool -list -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" > /tmp/kslist 2>/tmp/kserr; then
            echo "::error::KEYSTORE_PASSWORD is wrong (or the file is not a keystore)."
            sed 's/^/    /' /tmp/kserr
            exit 1
          fi

          # 3. Does the alias exist? keytool lowercases aliases on output.
          #    Exact field compare, not a regex — an alias may contain . * [ etc.
          if ! awk -F, -v want="$KEY_ALIAS" \
               'BEGIN{want=tolower(want)} tolower($1)==want{f=1} END{exit !f}' \
               /tmp/kslist; then
            echo "::error::KEY_ALIAS not found in the keystore."
            echo "::error::Aliases actually present (pick one of these):"
            grep -E ', (PrivateKeyEntry|trustedCertEntry)' /tmp/kslist \
              | cut -d, -f1 | sed 's/^/    /'
            exit 1
          fi

          # 4. Does the key password open the private key? -certreq needs it and
          #    changes nothing; output is discarded.
          if ! keytool -certreq -alias "$KEY_ALIAS" -keystore "$KS" \
                 -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
                 > /dev/null 2>/tmp/kperr; then
            echo "::error::KEY_PASSWORD is wrong for this alias."
            echo "::error::On many Android Studio keystores it equals KEYSTORE_PASSWORD — try that."
            sed 's/^/    /' /tmp/kperr
            exit 1
          fi

          echo "Keystore, alias and both passwords verified."
          echo "KEYSTORE_FILE=$KS" >> "$GITHUB_ENV"

      - name: Build debug APK
        if: github.event_name != 'workflow_dispatch' || inputs.build_type != 'release'
        run: >
          ./gradlew :app:assembleDebug --stacktrace
          -PappVersionName=${{ steps.version.outputs.name }}
          -PappVersionCode=${{ steps.version.outputs.code }}

      - name: Build release APK
        # KEYSTORE_FILE is only in the environment when the step above ran, and
        # app/build.gradle falls back to an unsigned build without it.
        if: github.event_name != 'workflow_dispatch' || inputs.build_type != 'debug'
        run: >
          ./gradlew :app:assembleRelease --stacktrace
          -PappVersionName=${{ steps.version.outputs.name }}
          -PappVersionCode=${{ steps.version.outputs.code }}

      - name: Collect APKs
        run: |
          mkdir -p out
          for f in app/build/outputs/apk/*/*.apk; do
            [ -e "$f" ] || continue
            variant=$(basename "$(dirname "$f")")
            cp "$f" "out/UC2Control-${{ steps.version.outputs.name }}-${variant}.apk"
          done
          ls -la out/

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: UC2Control-apk-${{ steps.version.outputs.name }}
          path: out/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload test & lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: app/build/reports/
          retention-days: 14

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
          body: |
            ### Install

            Download the `-release.apk` (or `-debug.apk`) below and sideload it.
            The app needs a phone with USB OTG support.

            Baud rates: 115200 (firmware default) and 921600 are both in the picker.
