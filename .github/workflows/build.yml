name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Which variant to build'
        required: true
        default: 'both'
        type: choice
        options: [ debug, release, both ]

permissions:
  contents: write

jobs:
  build:
    name: Assemble
    runs-on: ubuntu-latest

    # Secrets are lifted to job level on purpose: the `secrets` context is not
    # available in a step-level `if:`, but `env` is. Signing is optional — with
    # no secrets set these are empty and the release APK is built unsigned.
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Derive version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            NAME="${GITHUB_REF#refs/tags/v}"
          else
            NAME="0.0.0-${GITHUB_REF_NAME//\//-}+${GITHUB_SHA::7}"
          fi
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "Building version ${NAME} (code ${GITHUB_RUN_NUMBER})"

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Decode signing keystore
        # Runs only when KEYSTORE_BASE64 is set. Writes to RUNNER_TEMP rather
        # than the checkout so the key can never be picked up by an artifact
        # upload, and exports KEYSTORE_FILE for the release build below.
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "Keystore decoded ($(stat -c%s "$RUNNER_TEMP/release.jks") bytes)"

      - name: Build debug APK
        if: github.event_name != 'workflow_dispatch' || inputs.build_type != 'release'
        run: >
          ./gradlew :app:assembleDebug --stacktrace
          -PappVersionName=${{ steps.version.outputs.name }}
          -PappVersionCode=${{ steps.version.outputs.code }}

      - name: Build release APK
        # KEYSTORE_FILE is only in the environment when the step above ran, and
        # app/build.gradle falls back to an unsigned build without it.
        if: github.event_name != 'workflow_dispatch' || inputs.build_type != 'debug'
        run: >
          ./gradlew :app:assembleRelease --stacktrace
          -PappVersionName=${{ steps.version.outputs.name }}
          -PappVersionCode=${{ steps.version.outputs.code }}

      - name: Collect APKs
        run: |
          mkdir -p out
          for f in app/build/outputs/apk/*/*.apk; do
            [ -e "$f" ] || continue
            variant=$(basename "$(dirname "$f")")
            cp "$f" "out/UC2Control-${{ steps.version.outputs.name }}-${variant}.apk"
          done
          ls -la out/

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: UC2Control-apk-${{ steps.version.outputs.name }}
          path: out/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload test & lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: app/build/reports/
          retention-days: 14

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
          body: |
            ### Install

            Download the `-release.apk` (or `-debug.apk`) below and sideload it.
            The app needs a phone with USB OTG support.

            Baud rates: 115200 (firmware default) and 921600 are both in the picker.
