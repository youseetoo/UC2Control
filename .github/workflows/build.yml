name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Which variant to build'
        required: true
        default: 'both'
        type: choice
        options: [ debug, release, both ]

permissions:
  contents: write

jobs:
  build:
    name: Assemble
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Derive version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            NAME="${GITHUB_REF#refs/tags/v}"
          else
            NAME="0.0.0-${GITHUB_REF_NAME//\//-}+${GITHUB_SHA::7}"
          fi
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "Building version ${NAME} (code ${GITHUB_RUN_NUMBER})"

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Decode signing keystore
        # Optional. Set the four secrets to get a signed release APK; without
        # them the release APK is built unsigned and the debug APK is signed
        # with the standard debug key.
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "${{ github.workspace }}/release.jks"

      - name: Build debug APK
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_type != 'release' }}
        run: >
          ./gradlew :app:assembleDebug --stacktrace
          -PappVersionName=${{ steps.version.outputs.name }}
          -PappVersionCode=${{ steps.version.outputs.code }}

      - name: Build release APK
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_type != 'debug' }}
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_BASE64 != '' && format('{0}/release.jks', github.workspace) || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: >
          ./gradlew :app:assembleRelease --stacktrace
          -PappVersionName=${{ steps.version.outputs.name }}
          -PappVersionCode=${{ steps.version.outputs.code }}

      - name: Rename APKs
        run: |
          mkdir -p out
          for f in app/build/outputs/apk/*/*.apk; do
            [ -e "$f" ] || continue
            variant=$(basename "$(dirname "$f")")
            cp "$f" "out/UC2Control-${{ steps.version.outputs.name }}-${variant}.apk"
          done
          ls -la out/

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: UC2Control-apk-${{ steps.version.outputs.name }}
          path: out/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload test & lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
          retention-days: 14

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
          body: |
            ### Install

            Download the `-release.apk` (or `-debug.apk`) below and sideload it.
            The app needs a phone with USB OTG support.

            Baud rates: 115200 (firmware default) and 921600 are both in the picker.
